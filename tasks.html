<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks - Cloudflare D1 CRUD</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
            background-color: #f9fafb;
        }
        .card {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1), 0 1px 2px 0 rgba(0, 0, 0, 0.06);
            padding: 1.5rem;
        }
        .btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-weight: 500;
            transition: all 0.2s;
        }
        .btn-primary {
            background-color: #3b82f6;
            color: white;
        }
        .btn-primary:hover {
            background-color: #2563eb;
        }
        .btn-secondary {
            background-color: #6b7280;
            color: white;
        }
        .btn-secondary:hover {
            background-color: #4b5563;
        }
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        .table th {
            text-align: left;
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
            font-weight: 600;
            color: #374151;
        }
        .table td {
            padding: 0.75rem;
            border-bottom: 1px solid #e5e7eb;
            color: #4b5563;
        }
        .table tr:hover {
            background-color: #f9fafb;
        }
        .input {
            width: 100%;
            padding: 0.5rem 0.75rem;
            border: 1px solid #d1d5db;
            border-radius: 0.375rem;
            font-size: 0.875rem;
        }
        .input:focus {
            outline: none;
            ring: 2px;
            ring-color: #3b82f6;
            border-color: #3b82f6;
        }
        .modal {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
        }
        .modal-content {
            background: white;
            border-radius: 0.5rem;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
            max-width: 42rem;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }
    </style>
</head>
<body class="p-8">
    <div class="max-w-7xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Tasks</h1>
            <p class="text-gray-600 mt-2">Manage and view all tasks from Cloudflare D1 database</p>
            <div class="mt-4 flex items-center gap-4">
                <span id="task-count" class="px-3 py-1 bg-blue-100 text-blue-800 rounded-full text-sm">
                    0 tasks
                </span>
                <button onclick="fetchTasks()" class="px-3 py-1 bg-gray-100 text-gray-700 rounded text-sm hover:bg-gray-200 transition-colors">
                    Refresh
                </button>
            </div>
        </div>

        <div id="error-container" class="mb-6 hidden">
            <div class="p-4 bg-red-50 border border-red-200 rounded-lg">
                <p id="error-message" class="text-red-700"></p>
                <button onclick="fetchTasks()" class="mt-2 text-sm text-red-600 hover:text-red-800">
                    Retry
                </button>
            </div>
        </div>

        <div id="loading" class="card text-center py-12">
            <div class="animate-pulse">
                <div class="h-4 bg-gray-200 rounded w-1/4 mx-auto mb-4"></div>
                <div class="h-4 bg-gray-200 rounded w-1/2 mx-auto"></div>
            </div>
        </div>

        <div id="no-tasks" class="card text-center py-12 hidden">
            <p class="text-gray-500 mb-4">No tasks found in the database</p>
            <button onclick="showCreateModal()" class="btn btn-primary">
                Create your first task
            </button>
        </div>

        <div id="tasks-container" class="hidden">
            <div class="flex justify-between items-center mb-6">
                <div>
                    <h2 class="text-xl font-semibold text-gray-800">Task List</h2>
                    <p class="text-gray-600 text-sm">Showing <span id="display-count">0</span> tasks</p>
                </div>
                <button onclick="showCreateModal()" class="btn btn-primary">
                    + Create Task
                </button>
            </div>

            <div class="card overflow-hidden">
                <table class="table">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Title</th>
                            <th>Description</th>
                            <th>Status</th>
                            <th>Flow ID</th>
                            <th>Order</th>
                            <th>Created</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tasks-table-body">
                        <!-- Tasks will be populated here -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Create Modal -->
    <div id="create-modal" class="modal hidden">
        <div class="modal-content">
            <div class="p-6">
                <h2 class="text-xl font-semibold text-gray-800 mb-4">Create New Task</h2>
                <form id="create-form" onsubmit="createTask(event)">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                Task ID
                            </label>
                            <input type="text" required class="input" id="create-id" placeholder="e.g., task_001">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                Flow ID
                            </label>
                            <input type="text" required class="input" id="create-flow-id" placeholder="e.g., honoflow">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                Title
                            </label>
                            <input type="text" required class="input" id="create-title" placeholder="e.g., Initialize System">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">
                                Description
                            </label>
                            <textarea class="input min-h-[100px]" id="create-description" placeholder="Task description..."></textarea>
                        </div>
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">
                                    Status
                                </label>
                                <select class="input" id="create-status">
                                    <option value="pending">Pending</option>
                                    <option value="done">Done</option>
                                </select>
                            </div>
                            <div>
                                <label class="block text-sm font-medium text-gray-700 mb-1">
                                    Order Index
                                </label>
                                <input type="number" class="input" id="create-order-index" value="0">
                            </div>
                        </div>
                    </div>
                    <div class="flex justify-end space-x-3 mt-6">
                        <button type="button" onclick="hideCreateModal()" class="btn btn-secondary">
                            Cancel
                        </button>
                        <button type="submit" class="btn btn-primary">
                            Create Task
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:48647/api';
        let tasks = [];
        let flows = [];

        async function fetchTasks() {
            showLoading();
            hideError();
            
            try {
                const [tasksResponse, flowsResponse] = await Promise.all([
                    fetch(`${API_BASE}/tasks`),
                    fetch(`${API_BASE}/flow-steps`)
                ]);

                if (!tasksResponse.ok) throw new Error(`Failed to fetch tasks: ${tasksResponse.status}`);
                if (!flowsResponse.ok) throw new Error(`Failed to fetch flows: ${flowsResponse.status}`);

                const tasksData = await tasksResponse.json();
                const flowsData = await flowsResponse.json();

                // Extract results from Cloudflare D1 response
                // Handle different response formats
                console.log('tasksData:', tasksData);
                console.log('flowsData:', flowsData);
                
                if (Array.isArray(tasksData) && tasksData.length > 0 && tasksData[0].results) {
                    tasks = tasksData[0].results;
                } else if (tasksData.results) {
                    tasks = tasksData.results;
                } else if (Array.isArray(tasksData)) {
                    tasks = tasksData;
                } else {
                    tasks = [];
                }
                
                if (Array.isArray(flowsData) && flowsData.length > 0 && flowsData[0].results) {
                    flows = flowsData[0].results;
                } else if (flowsData.results) {
                    flows = flowsData.results;
                } else if (Array.isArray(flowsData)) {
                    flows = flowsData;
                } else {
                    flows = [];
                }
                
                console.log('tasks after extraction:', tasks);
                console.log('flows after extraction:', flows);

                updateUI();
            } catch (error) {
                showError(error.message);
            }
        }

        function updateUI() {
            hideLoading();
            
            if (tasks.length === 0) {
                document.getElementById('no-tasks').classList.remove('hidden');
                document.getElementById('tasks-container').classList.add('hidden');
                document.getElementById('task-count').textContent = '0 tasks';
            } else {
                document.getElementById('no-tasks').classList.add('hidden');
                document.getElementById('tasks-container').classList.remove('hidden');
                
                document.getElementById('task-count').textContent = `${tasks.length} task${tasks.length !== 1 ? 's' : ''}`;
                document.getElementById('display-count').textContent = tasks.length;
                
                const tbody = document.getElementById('tasks-table-body');
                tbody.innerHTML = '';
                
                tasks.forEach((task, index) => {
                    try {
                        console.log(`Processing task ${index}:`, task);
                        if (!task || task === null || task === undefined) {
                            console.error(`Task ${index} is null or undefined!`, task);
                            return;
                        }
                        
                        const flow = flows.find(f => f.id === task.flow_id);
                        const flowName = flow ? flow.name : task.flow_id;
                        
                        const row = document.createElement('tr');
                        row.innerHTML = `
                            <td class="font-mono text-xs">${task.id ? task.id.substring(0, 8) + '...' : 'N/A'}</td>
                            <td class="font-medium">${task.title || 'No title'}</td>
                            <td>${task.description || '-'}</td>
                            <td>
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${task.status === 'done' ? 'bg-green-100 text-green-800' : 'bg-yellow-100 text-yellow-800'}">
                                    ${task.status === 'done' ? '✅ Done' : '⏳ Pending'}
                                </span>
                            </td>
                            <td class="text-sm">${flowName}</td>
                            <td>${task.order_index}</td>
                            <td class="text-sm">${task.created_at ? new Date(task.created_at).toLocaleDateString() : 'N/A'}</td>
                            <td>
                                <button onclick="toggleStatus('${task.id || ''}')" class="text-blue-600 hover:text-blue-800 text-sm mr-3">
                                    Toggle Status
                                </button>
                                <button onclick="deleteTask('${task.id || ''}')" class="text-red-600 hover:text-red-800 text-sm">
                                    Delete
                                </button>
                            </td>
                        `;
                        tbody.appendChild(row);
                    } catch (error) {
                        console.error(`Error processing task ${index}:`, error, task);
                    }
                });
            }
        }

        async function createTask(event) {
            event.preventDefault();
            
            const taskData = {
                id: document.getElementById('create-id').value,
                flow_id: document.getElementById('create-flow-id').value,
                title: document.getElementById('create-title').value,
                description: document.getElementById('create-description').value,
                status: document.getElementById('create-status').value,
                order_index: parseInt(document.getElementById('create-order-index').value)
            };

            try {
                const response = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify(taskData)
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to create task: ${response.status}`);
                }

                hideCreateModal();
                fetchTasks();
            } catch (error) {
                alert(`Error creating task: ${error.message}`);
            }
        }

        async function toggleStatus(taskId) {
            const task = tasks.find(t => t.id === taskId);
            if (!task) return;

            const newStatus = task.status === 'pending' ? 'done' : 'pending';
            
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        ...task,
                        status: newStatus
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to update task: ${response.status}`);
                }

                fetchTasks();
            } catch (error) {
                alert(`Error updating task: ${error.message}`);
            }
        }

        async function deleteTask(taskId) {
            if (!confirm('Are you sure you want to delete this task?')) return;
            
            try {
                const response = await fetch(`${API_BASE}/tasks/${taskId}`, {
                    method: 'DELETE'
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.error || `Failed to delete task: ${response.status}`);
                }

                fetchTasks();
            } catch (error) {
                alert(`Error deleting task: ${error.message}`);
            }
        }

        function showCreateModal() {
            document.getElementById('create-modal').classList.remove('hidden');
            document.getElementById('create-form').reset();
        }

        function hideCreateModal() {
            document.getElementById('create-modal').classList.add('hidden');
        }

        function showLoading() {
            document.getElementById('loading').classList.remove('hidden');
            document.getElementById('tasks-container').classList.add('hidden');
            document.getElementById('no-tasks').classList.add('hidden');
        }

        function hideLoading() {
            document.getElementById('loading').classList.add('hidden');
        }

        function showError(message) {
            document.getElementById('error-message').textContent = message;
            document.getElementById('error-container').classList.remove('hidden');
            hideLoading();
        }

        function hideError() {
            document.getElementById('error-container').classList.add('hidden');
        }

        // Initialize
        document.addEventListener('DOMContentLoaded', fetchTasks);
    </script>
</body>
</html>
