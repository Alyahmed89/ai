name = "deepseek-agent"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[vars]
DEEPSEEK_API_KEY = "sk-57370a37c79f4b7db9dbd1e253c25b8b"
OPENHANDS_API_URL = "https://openhands.anyapp.cfd/api"

# Use completely new class name for clean slate
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationOrchestratorDO_2026A"

# D1 database for flow runs tracking
[[d1_databases]]
binding = "FLOW_RUNS_DB"
database_name = "flow-runs-db"
database_id = ""

# Migration for new Durable Object class (free plan requires new_sqlite_classes)
[[migrations]]
tag = "v1"
new_sqlite_classes = [ "ConversationOrchestratorDO_2026A" ]

# Migration for D1 database
[[migrations]]
tag = "v2"
migration = """
  CREATE TABLE IF NOT EXISTS flow_runs (
    id TEXT PRIMARY KEY,
    conversation_id TEXT NOT NULL,
    initial_prompt TEXT NOT NULL,
    deepseek_system TEXT,
    repository TEXT NOT NULL,
    branch TEXT DEFAULT 'main',
    max_iterations INTEGER DEFAULT 500,
    actual_iterations INTEGER DEFAULT 0,
    status TEXT DEFAULT 'active',
    stop_reason TEXT,
    prompts_and_responses TEXT NOT NULL,
    created_at INTEGER NOT NULL,
    updated_at INTEGER NOT NULL,
    ended_at INTEGER,
    next_flow_id TEXT,
    task_type TEXT,
    success_score REAL,
    quality_metrics TEXT,
    deployment_id TEXT,
    improvement_suggestions TEXT
  );
  
  CREATE TABLE IF NOT EXISTS iterations (
    id INTEGER PRIMARY KEY AUTOINCREMENT,
    flow_run_id TEXT NOT NULL,
    iteration_number INTEGER NOT NULL,
    prompt TEXT NOT NULL,
    response TEXT NOT NULL,
    openhands_response TEXT,
    timestamp INTEGER NOT NULL,
    metadata TEXT,
    FOREIGN KEY (flow_run_id) REFERENCES flow_runs(id) ON DELETE CASCADE
  );
  
  CREATE INDEX IF NOT EXISTS idx_flow_runs_conversation_id ON flow_runs(conversation_id);
  CREATE INDEX IF NOT EXISTS idx_flow_runs_status ON flow_runs(status);
  CREATE INDEX IF NOT EXISTS idx_flow_runs_created_at ON flow_runs(created_at);
  CREATE INDEX IF NOT EXISTS idx_iterations_flow_run_id ON iterations(flow_run_id);
"""