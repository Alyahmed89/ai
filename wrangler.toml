name = "deepseek-agent"
main = "src/index-crud.ts"
compatibility_date = "2024-01-01"
account_id = "e39371fc55a5c9ef7ed83e16660bd7bb"

[build]
command = "node scripts/generate-version.js"

[vars]
DEEPSEEK_API_KEY = "sk-77623ca07af544e78bb701fd3ad2cd91"
OPENHANDS_API_URL = "https://openhands.anyapp.cfd/api"
ADMIN_KEY = "test-admin-key-123"  # Change this in production
# SigNoz OpenTelemetry configuration
OTEL_EXPORTER_OTLP_ENDPOINT = "https://otel.anyapp.cfd"
# OTEL_EXPORTER_OTLP_TRACES_ENDPOINT = "https://otel.anyapp.cfd/v1/traces"  # TEMPORARILY REMOVED
OTEL_EXPORTER_OTLP_LOGS_ENDPOINT = "https://otel.anyapp.cfd/v1/logs"
OTEL_EXPORTER_OTLP_HEADERS = "api-key=k9DpiOXK6zPvRX48mhatUty9ipul+nrNf5mbu689kYM="
OTEL_SERVICE_NAME = "deepseek-agent"

# Use actual exported class name (original ConversationOrchestratorDO_2026A to restore flow execution)
[[durable_objects.bindings]]
name = "CONVERSATIONS"
class_name = "ConversationOrchestratorDO_2026A"

# D1 database for flow runs tracking (etaflow tasks database)
[[d1_databases]]
binding = "FLOW_RUNS_DB"
database_name = "flow-runs-db"
database_id = "ce8f2a2c-6e4b-4398-b73e-ba8f204f609a"
migrations_dir = "migrations"

# D1 database for project facts (optional)
[[d1_databases]]
binding = "PROJECT_FACTS_DB"
database_name = "project-facts-db"
database_id = "35f4cc1c-5656-4c02-bda8-26b62b63e6ca"

# KV namespace for rate limiting (optional - uncomment after creating namespace)
# First create namespace with: npx wrangler kv namespace create "RATE_LIMIT_KV"
# Then update the id below with the generated namespace ID
# [[kv_namespaces]]
# binding = "RATE_LIMIT_KV"
# id = ""  # TODO: Create namespace and add ID here

# Durable Object migration for new class (using new_sqlite_classes for free plan)
[[migrations]]
tag = "v1"
new_sqlite_classes = ["ConversationOrchestratorDO_2026A"]